version: '3.8'

services:
  monitoring-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # autonomy-events sibling package the Dockerfile copies in (see its
      # own comment for why - added 2026-08-14 alongside the canonical
      # Severity mapping).
      context: ../..
      dockerfile: monitoring-engine/docker/Dockerfile
    container_name: monitoring-engine
    ports:
      - "8043:8043"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/monitoring
      - REDIS_URL=redis://redis:6379/6
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60}
      - METRICS_COLLECTION_INTERVAL=${METRICS_COLLECTION_INTERVAL:-30}
      - CPU_WARNING_THRESHOLD=${CPU_WARNING_THRESHOLD:-80.0}
      - CPU_CRITICAL_THRESHOLD=${CPU_CRITICAL_THRESHOLD:-90.0}
      - MEMORY_WARNING_THRESHOLD=${MEMORY_WARNING_THRESHOLD:-80.0}
      - MEMORY_CRITICAL_THRESHOLD=${MEMORY_CRITICAL_THRESHOLD:-90.0}
      - DEBUG=${DEBUG:-false}
      - NOTIFICATION_ENGINE_URL=http://notification-engine:8037
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8043/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true
