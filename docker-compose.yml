version: '3.8'

services:
  monitoring-engine:
    build: .
    container_name: monitoring-engine
    ports:
      - "8044:8044"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/monitoring}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DEBUG=${DEBUG:-false}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    networks:
      - os42

  postgres:
    image: postgres:15-alpine
    container_name: monitoring-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=monitoring
    volumes:
      - monitoring-postgres-data:/var/lib/postgresql/data
    networks:
      - os42

  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    networks:
      - os42

volumes:
  monitoring-postgres-data:

networks:
  os42:
    driver: bridge
